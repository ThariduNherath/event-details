name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Package cache කිරීමට මේ line එක එකතු කිරීමෙන් build speed වේ

      - run: npm install
      - run: npm run lint
      # Jest process එක හිර නොවී exit වීම සඳහා flags එකතු කර ඇත
      - run: npm test -- --forceExit --detectOpenHandles

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm install
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy-for-build